[project]
name = "video-mammoth-vlm-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "video-mammoth-models",
    "fastapi",
    "uvicorn",
    "pydantic>=2.14,<3",
    "jsonschema",
    "referencing",
    "lm-format-enforcer>=0.11.3,<0.12",
    "transformers==5.19.0",
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "pillow>=12.3,<14",
    "flash-linear-attention[cuda]>=0.6.0",
]

[tool.uv.sources]
video-mammoth-models = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
